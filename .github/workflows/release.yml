name: Slint Desktop Build and Release

on:
  push:
    branches: [slint]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libdbus-1-dev fonts-noto-cjk
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path rust/src/excel_to_xml/Cargo.toml -- --check
      - name: Lint desktop and core
        run: |
          cargo clippy --locked --all-targets --features preview -- -D warnings
          cargo clippy --locked --manifest-path rust/src/excel_to_xml/Cargo.toml --all-targets -- -D warnings
      - name: Test desktop and core
        run: |
          cargo test --locked --features preview
          cargo test --locked --manifest-path rust/src/excel_to_xml/Cargo.toml
      - name: Render UI states
        run: |
          mkdir -p target/previews
          for state in idle busy error success about; do
            cargo run --locked --features preview --bin e2xf-preview -- "target/previews/$state.png" "$state"
          done
          cargo run --locked --features preview --bin e2xf-preview -- target/previews/minimum.png error 660x660
      - uses: actions/upload-artifact@v4
        with:
          name: slint-ui-previews
          path: target/previews/*.png

  build-macos:
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            target: aarch64-apple-darwin
          - architecture: x86_64
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Build native application
        run: cargo build --locked --release --bin e2xf --target ${{ matrix.target }}
      - name: Package app and DMG
        run: |
          bash scripts/package-macos.sh ${{ matrix.target }}
          mkdir -p dist/dmg-${{ matrix.architecture }}
          cp -R dist/macos/${{ matrix.architecture }}/e2xf.app dist/dmg-${{ matrix.architecture }}/
          ln -s /Applications dist/dmg-${{ matrix.architecture }}/Applications
          hdiutil create -volname e2xf -srcfolder dist/dmg-${{ matrix.architecture }} -ov -format UDZO e2xf-macos-${{ matrix.architecture }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.architecture }}
          path: e2xf-macos-${{ matrix.architecture }}.dmg

  build-windows:
    needs: validate
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build native application
        run: cargo build --locked --release --bin e2xf
      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force
          Copy-Item target/release/e2xf.exe dist/windows/
          Copy-Item packaging/README.txt dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath e2xf-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: e2xf-windows.zip

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libdbus-1-dev
      - name: Build native application
        run: cargo build --locked --release --bin e2xf
      - name: Create tarball
        run: |
          mkdir -p dist/linux
          cp target/release/e2xf packaging/README.txt packaging/linux/e2xf.desktop dist/linux/
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png dist/linux/e2xf.png
          tar -C dist/linux -czf e2xf-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: e2xf-linux.tar.gz

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-app*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            e2xf-macos-arm64.dmg
            e2xf-macos-x86_64.dmg
            e2xf-windows.zip
            e2xf-linux.tar.gz
